name: Build Droidian Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "URL of the kernel source repository (e.g. https://github.com/user/kernel-source)"
        required: true
        type: string
        default: "https://gitlab.com/alghiffaryfa19/kernel-android-common"
      kernel_branch:
        description: "Branch of the kernel source to build"
        required: true
        type: string
        default: "android13-5.15-halium"

jobs:
  build:
    runs-on: ubuntu-latest
permissions:
      contents: write
    name: Build Kernel Package

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v5
        with:
          path: builder
          submodules: recursive

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" \
            "${{ github.event.inputs.kernel_source }}" kernel-source

      - name: Prepare output directory
        run: mkdir -p packages

      - name: Build kernel in Droidian container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/packages:/buildd" \
            -v "${{ github.workspace }}/kernel-source:/buildd/sources" \
            -v "${{ github.workspace }}/builder:/buildd/builder" \
            -v "${{ github.workspace }}/builder/build.sh:/buildd/build.sh" \
            quay.io/droidian/build-essential:current-amd64 \
            bash /buildd/build.sh

      - name: List built packages
        run: |
          echo "=== Built packages ==="
          ls -lah packages/*.deb 2>/dev/null || echo "No .deb packages found"
          echo "=== Boot images ==="
          ls -lah packages/*.img 2>/dev/null || echo "No .img files found"

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: droidian-kernel-packages
          path: |
            packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload boot images
        uses: actions/upload-artifact@v4
        with:
          name: droidian-boot-images
          path: |
            packages/*.img
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate Release Tag
        run: echo "RELEASE_TAG=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: droidian-kernel-${{ env.RELEASE_TAG }}
          name: Droidian Kernel Build ${{ env.RELEASE_TAG }}
          files: |
            packages/*.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
